<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Rider</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  background:#0f172a;
  color:white;
}

/* HEADER */
.header{
  padding:20px;
  background:#020617;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  font-size:18px;
}

.badge{
  background:#06b6d4;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-around;
  padding:15px;
}

.stat{
  text-align:center;
}

.stat p{
  font-size:20px;
  font-weight:bold;
}

/* LIST */
.container{
  padding:15px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  border:1px solid rgba(255,255,255,0.1);
}

.card h3{
  margin-bottom:5px;
}

.card small{
  opacity:0.7;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

/* STATUS */
.status{
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
}

.pending{
  background:#f59e0b;
}

.paid{
  background:#22c55e;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#06b6d4;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:gray;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h2>Rider Dashboard</h2>
  <div class="badge">Rider 1</div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat">
    <p id="total">0</p>
    <small>Total</small>
  </div>

  <div class="stat">
    <p id="collected">0</p>
    <small>Collected</small>
  </div>

  <div class="stat">
    <p id="pending">0</p>
    <small>Pending</small>
  </div>
</div>

<!-- LIST -->
<div class="container" id="list"></div>

<script>

// SAMPLE DATA (galing dapat sa admin/database)
let data = [
  {name:"Juan Dela Cruz", amount:5000, status:"pending"},
  {name:"Maria Santos", amount:3000, status:"pending"},
  {name:"Pedro Reyes", amount:7000, status:"pending"}
];

// RENDER LIST
function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  let total = data.length;
  let collected = data.filter(d=>d.status==="paid").length;
  let pending = total - collected;

  document.getElementById("total").innerText = total;
  document.getElementById("collected").innerText = collected;
  document.getElementById("pending").innerText = pending;

  data.forEach((d,i)=>{
    list.innerHTML += `
      <div class="card">
        <h3>${d.name}</h3>
        <small>Amount: ₱${d.amount}</small>

        <div class="row">
          <span class="status ${d.status}">
            ${d.status === "paid" ? "Paid" : "Pending"}
          </span>
        </div>

        <button onclick="markPaid(${i})" ${d.status==="paid"?"disabled":""}>
          Mark as Collected
        </button>
      </div>
    `;
  });
}

// MARK AS PAID
function markPaid(i){
  data[i].status = "paid";
  render();
}

// INIT
render();

</script>

</body>
</html>
