<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kasipag Rider Dashboard</title>

<style>
:root{
  --bg:#0b1220;
  --glass:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);
  --primary:#06b6d4;
  --text:#e5e7eb;
  --muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  background:linear-gradient(135deg,#020617,#0f172a);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  background:rgba(2,6,23,.8);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
}

.badge{
  padding:6px 10px;
  border-radius:999px;
  background:rgba(6,182,212,.2);
  color:#67e8f9;
  font-size:12px;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* STATS */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.card{
  background:var(--glass);
  border:1px solid var(--border);
  padding:10px;
  border-radius:12px;
  text-align:center;
}

.card h4{
  font-size:12px;
  color:var(--muted);
}

.card p{
  font-size:20px;
  font-weight:600;
}

/* ITEM */
.item{
  background:var(--glass);
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.row{
  display:flex;
  justify-content:space-between;
}

.small{
  font-size:12px;
  color:var(--muted);
}

/* STATUS */
.status{
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}

.Pending{background:rgba(245,158,11,.2);color:#fbbf24}
.Collected{background:rgba(59,130,246,.2);color:#60a5fa}

/* BUTTON */
button{
  margin-top:8px;
  padding:8px 10px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  cursor:pointer;
  font-weight:600;
}

button:hover{opacity:.8}

</style>
</head>

<body>

<header>
  <div id="title">RIDER</div>
  <div class="badge" id="badge">ONLINE</div>
</header>

<div class="container">

<!-- STATS -->
<div class="grid">
  <div class="card">
    <h4>Assigned</h4>
    <p id="total">0</p>
  </div>

  <div class="card">
    <h4>Collected</h4>
    <p id="collected">0</p>
  </div>

  <div class="card">
    <h4>Pending</h4>
    <p id="pending">0</p>
  </div>
</div>

<!-- LIST -->
<div id="list"></div>

</div>

<script>

let role = localStorage.getItem("role") || "rider3";
role = role.toLowerCase();

document.getElementById("title").innerText = role.toUpperCase();

let loans = JSON.parse(localStorage.getItem("loans")) || [];

/* REALTIME UPDATE */
window.addEventListener("storage", () => {
  loans = JSON.parse(localStorage.getItem("loans")) || [];
  render();
});

/* RENDER */
function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  let total = 0;
  let collected = 0;
  let pending = 0;

  loans.forEach((l,i)=>{

    if(!l.rider) return;
    if(l.rider.toLowerCase() !== role) return;

    total++;
    if(l.status === "Collected") collected++;
    if(l.status === "Pending") pending++;

    list.innerHTML += `
    <div class="item">
      <div class="row">
        <b>${l.leader}</b>
        <span class="status ${l.status}">${l.status}</span>
      </div>

      <div class="small">₱${l.amount}</div>
      <div class="small">Assigned: ${l.rider}</div>

      ${l.status === "Pending"
        ? `<button onclick="collect(${i})">Collect</button>`
        : `<div class="small">Completed ✔</div>`}
    </div>
    `;
  });

  document.getElementById("total").innerText = total;
  document.getElementById("collected").innerText = collected;
  document.getElementById("pending").innerText = pending;

  localStorage.setItem("loans", JSON.stringify(loans));
}

/* COLLECT */
function collect(i){
  loans[i].status = "Collected";
  localStorage.setItem("loans", JSON.stringify(loans));
  render();
}

/* INIT */
render();

</script>

</body>
</html>
