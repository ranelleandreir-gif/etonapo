<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kasipag Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h2>Kasipag</h2>

  <a href="#" onclick="showSection('dashboard')">📊 Dashboard</a>
  <a href="#" onclick="showSection('loans')">💰 Loans</a>
</div>

<div class="main">

  <!-- DASHBOARD -->
  <div id="dashboard" class="section">
    <h1>Admin Dashboard</h1>
    <p>Welcome back, Admin 👋</p>

    <div class="cards">
      <div class="card"><h3>Total Loans</h3><p>₱120,000</p></div>
      <div class="card"><h3>Borrowers</h3><p>48</p></div>
      <div class="card"><h3>Paid</h3><p>₱8,500</p></div>
      <div class="card"><h3>Pending</h3><p>12</p></div>
    </div>
  </div>

  <!-- LOANS -->
  <div id="loans" class="section hidden">

    <div class="loan-form">
      <h2>Add Loan</h2>

      <input type="text" id="leader" placeholder="Team Leader Name">

      <input type="text" id="members" placeholder="Members (comma separated)">

      <input type="number" id="amount" placeholder="Loan Amount">

      <select id="type" onchange="toggleMembers()">
        <option value="Solo">Solo</option>
        <option value="Group">Group</option>
      </select>

      <button onclick="addLoan()">Add Loan</button>
    </div>

    <div class="table-box">
      <h2>Recent Loans</h2>

      <table>
        <thead>
          <tr>
            <th>Borrower</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="loanTable"></tbody>
      </table>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
