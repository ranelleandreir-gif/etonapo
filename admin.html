<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Admin System</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --blue:#06b6d4;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:var(--bg);
  color:white;
}

/* HEADER */
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  background:rgba(2,6,23,0.9);
  backdrop-filter:blur(10px);
}

.header h2{color:var(--blue);}

/* NAV */
.nav{
  display:flex;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.nav button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#020617;
  color:white;
  border:1px solid var(--border);
}

.nav button:hover{
  background:var(--blue);
}

/* SECTION */
.section{
  display:none;
  padding:15px;
}

.active{
  display:block;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
}

/* TABLE */
table{
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
}

th{
  background:#020617;
  font-size:12px;
  color:gray;
}

/* STATUS */
.status{
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
}

.pending{background:var(--yellow);}
.collected{background:var(--blue);}
.verified{background:var(--green);}
.notcollected{background:var(--red);}

button.action{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.collect{background:var(--blue);}
.verify{background:var(--green);}
</style>
</head>

<body>

<div class="header">
  <h2>Kasipag Admin</h2>
  <button onclick="logout()" style="background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;">Logout</button>
</div>

<!-- NAVIGATION -->
<div class="nav">
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('loans')">Loans</button>
  <button onclick="show('collected')">Collected</button>
  <button onclick="show('notcollected')">Not Collected</button>
  <button onclick="show('pending')">Pending</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <div class="grid">
    <div class="card">Total Loans <h2 id="t"></h2></div>
    <div class="card">Pending <h2 id="p"></h2></div>
    <div class="card">Collected <h2 id="c"></h2></div>
    <div class="card">Verified <h2 id="v"></h2></div>
  </div>
</div>

<!-- LOANS -->
<div id="loans" class="section">
  <h3>All Loans</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="allLoans"></tbody>
  </table>
</div>

<!-- COLLECTED -->
<div id="collected" class="section">
  <h3>Collected Accounts</h3>
  <div id="collectedList"></div>
</div>

<!-- NOT COLLECTED -->
<div id="notcollected" class="section">
  <h3>Not Collected</h3>
  <div id="notList"></div>
</div>

<!-- PENDING -->
<div id="pending" class="section">
  <h3>Pending Loans</h3>
  <div id="pendingList"></div>
</div>

<script>

let loans = JSON.parse(localStorage.getItem("loans")) || [];

/* NAV */
function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ACTIONS */
function collect(i){
  loans[i].status="Collected";
  save();
}

function verify(i){
  loans[i].status="Verified";
  save();
}

function save(){
  localStorage.setItem("loans",JSON.stringify(loans));
  render();
}

/* RENDER */
function render(){

let t=0,p=0,c=0,v=0;

allLoans.innerHTML="";
collectedList.innerHTML="";
notList.innerHTML="";
pendingList.innerHTML="";

loans.forEach((l,i)=>{

t++;

if(l.status==="Pending") p++;
if(l.status==="Collected") c++;
if(l.status==="Verified") v++;

/* ALL */
allLoans.innerHTML+=`
<tr>
<td>${l.name}</td>
<td>₱${l.amount}</td>
<td><span class="status ${l.status.toLowerCase()}">${l.status}</span></td>
<td>
${l.status==="Pending"
? `<button class="action collect" onclick="collect(${i})">Collect</button>`
: l.status==="Collected"
? `<button class="action verify" onclick="verify(${i})">Verify</button>`
: "✔"}
</td>
</tr>
`;

/* COLLECTED */
if(l.status==="Collected"){
collectedList.innerHTML+=`
<div class="card">${l.name} - ₱${l.amount}</div>`;
}

/* NOT COLLECTED */
if(l.status==="Pending"){
notList.innerHTML+=`
<div class="card">${l.name} - ₱${l.amount}</div>`;
}

/* PENDING */
if(l.status==="Pending"){
pendingList.innerHTML+=`
<div class="card">${l.name} - ₱${l.amount}</div>`;
}

});

t.innerText=t;
p.innerText=p;
c.innerText=c;
v.innerText=v;

}

function logout(){
  localStorage.removeItem("role");
  window.location.href="login.html";
}

render();

</script>

</body>
</html>
