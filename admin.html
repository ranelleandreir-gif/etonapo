<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Admin System</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --blue:#06b6d4;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:var(--bg);
  color:white;
}

/* HEADER */
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(2,6,23,0.9);
  backdrop-filter:blur(10px);
}

.header h2{color:var(--blue);}

/* NAV */
.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:10px;
}

.nav button{
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
  cursor:pointer;
}

.nav button:hover{
  background:var(--blue);
}

/* SECTION */
.section{
  display:none;
  padding:15px;
}

.active{display:block;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
}

/* TABLE */
table{
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
}

th{
  background:#020617;
  color:gray;
  font-size:12px;
}

/* STATUS */
.status{
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
}

.pending{background:var(--yellow);}
.collected{background:var(--blue);}
.notcollected{background:var(--red);}

/* BUTTON */
button.action{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.collect{background:var(--blue);}
.notc{background:var(--red);}

/* ADD LOAN */
.form{
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:400px;
}

input,select{
  padding:10px;
  border-radius:8px;
  border:none;
  background:#020617;
  color:white;
}

/* GROUP TABLE */
.group-table{
  width:100%;
  margin-top:10px;
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="header">
  <h2>Kasipag Admin</h2>
  <button onclick="logout()" style="background:#ef4444;color:white;padding:8px 12px;border:none;border-radius:8px;">Logout</button>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="show('dashboard')">Dashboard</button>
  <button onclick="show('add')">Add Loan</button>
  <button onclick="show('loans')">Loans</button>
  <button onclick="show('collected')">Collected</button>
  <button onclick="show('notcollected')">Not Collected</button>
  <button onclick="show('pending')">Pending</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
  <div class="grid">
    <div class="card">Total Loans <h2 id="t">0</h2></div>
    <div class="card">Pending <h2 id="p">0</h2></div>
    <div class="card">Collected <h2 id="c">0</h2></div>
    <div class="card">Not Collected <h2 id="nc">0</h2></div>
  </div>
</div>

<!-- ADD LOAN -->
<div id="add" class="section">
  <h3>Add Loan</h3>

  <div class="form">

    <select id="type" onchange="toggleType()">
      <option value="solo">Solo</option>
      <option value="group">Group</option>
    </select>

    <!-- SOLO -->
    <div id="soloBox">
      <input id="soloName" placeholder="Borrower Name">
      <input id="soloAmount" placeholder="Amount">
    </div>

    <!-- GROUP -->
    <div id="groupBox" class="hidden">
      <input id="groupName" placeholder="Group Name">

      <table class="group-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="groupMembers"></tbody>
      </table>

      <button onclick="addRow()">+ Add Member</button>
    </div>

    <button onclick="addLoan()" style="background:var(--green);color:white;">Submit Loan</button>

  </div>
</div>

<!-- LOANS -->
<div id="loans" class="section">
  <h3>All Loans</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Type</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="allLoans"></tbody>
  </table>
</div>

<!-- COLLECTED -->
<div id="collected" class="section">
  <h3>Collected</h3>
  <div id="collectedList"></div>
</div>

<!-- NOT COLLECTED -->
<div id="notcollected" class="section">
  <h3>Not Collected</h3>
  <div id="notList"></div>
</div>

<!-- PENDING -->
<div id="pending" class="section">
  <h3>Pending</h3>
  <div id="pendingList"></div>
</div>

<script>

let loans = JSON.parse(localStorage.getItem("loans")) || [];

/* NAV */
function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* TOGGLE SOLO / GROUP */
function toggleType(){
  let type = document.getElementById("type").value;
  document.getElementById("soloBox").classList.toggle("hidden", type!=="solo");
  document.getElementById("groupBox").classList.toggle("hidden", type!=="group");
}

/* ADD ROW (GROUP) */
function addRow(){
  let row = document.createElement("tr");
  row.innerHTML = `
    <td><input placeholder="Name"></td>
    <td><input placeholder="Amount"></td>
  `;
  document.getElementById("groupMembers").appendChild(row);
}

/* ADD LOAN */
function addLoan(){

  let type = document.getElementById("type").value;

  if(type === "solo"){
    loans.push({
      type:"Solo",
      name:soloName.value,
      amount:soloAmount.value,
      status:"Pending"
    });
  }

  if(type === "group"){
    let group = [];
    document.querySelectorAll("#groupMembers tr").forEach(r=>{
      group.push({
        name:r.children[0].children[0].value,
        amount:r.children[1].children[0].value
      });
    });

    loans.push({
      type:"Group",
      name:groupName.value,
      members:group,
      status:"Pending"
    });
  }

  localStorage.setItem("loans",JSON.stringify(loans));
  render();
  alert("Loan Added ✔");
}

/* UPDATE STATUS */
function collect(i){
  loans[i].status="Collected";
  save();
}

function notCollected(i){
  loans[i].status="Not Collected";
  save();
}

function save(){
  localStorage.setItem("loans",JSON.stringify(loans));
  render();
}

/* RENDER */
function render(){

let t=0,p=0,c=0,nc=0;

allLoans.innerHTML="";
collectedList.innerHTML="";
notList.innerHTML="";
pendingList.innerHTML="";

loans.forEach((l,i)=>{

t++;
if(l.status==="Pending") p++;
if(l.status==="Collected") c++;
if(l.status==="Not Collected") nc++;

/* ALL */
allLoans.innerHTML+=`
<tr>
<td>${l.name}</td>
<td>${l.amount || "Group"}</td>
<td>${l.type}</td>
<td><span class="status ${l.status.toLowerCase().replace(" ","")}">${l.status}</span></td>
</tr>
`;

/* COLLECTED */
if(l.status==="Collected"){
collectedList.innerHTML+=`<div class="card">${l.name}</div>`;
}

/* NOT */
if(l.status==="Not Collected"){
notList.innerHTML+=`<div class="card">${l.name}</div>`;
}

/* PENDING */
if(l.status==="Pending"){
pendingList.innerHTML+=`<div class="card">${l.name}</div>`;
}

});

t.innerText=t;
p.innerText=p;
c.innerText=c;
nc.innerText=nc;

}

function logout(){
  localStorage.removeItem("role");
  window.location.href="login.html";
}

render();

</script>

</body>
</html>
