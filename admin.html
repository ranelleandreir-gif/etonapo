<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Admin Control Center</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --blue:#06b6d4;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  display:flex;
  background:var(--bg);
  color:white;
  min-height:100vh;
}

/* 🔥 SIDEBAR (MOBILE FRIENDLY) */
.sidebar{
  width:260px;
  background:rgba(2,6,23,0.9);
  backdrop-filter:blur(10px);
  border-right:1px solid var(--border);
  padding:20px;
  transition:.3s;
}

.sidebar h2{
  color:var(--blue);
  margin-bottom:20px;
}

.sidebar a{
  display:block;
  padding:12px;
  margin-bottom:8px;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.sidebar a:hover{
  background:var(--blue);
  transform:translateX(5px);
}

/* 🔥 MAIN */
.main{
  flex:1;
  padding:25px;
}

/* 🔥 DASHBOARD GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:18px;
  border-radius:16px;
  backdrop-filter:blur(10px);
  transition:.3s;
}

.card:hover{
  transform:scale(1.03);
  box-shadow:0 0 20px rgba(6,182,212,0.2);
}

/* USER CARD */
.user-card{
  background:rgba(255,255,255,0.04);
  padding:15px;
  border-radius:14px;
  margin-bottom:10px;
  border:1px solid var(--border);
  transition:.3s;
}

.user-card:hover{
  transform:translateY(-3px);
}

/* BUTTONS */
button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
  transition:.3s;
}

button:hover{
  transform:scale(1.05);
}

.approve{background:var(--green);color:white;}
.reject{background:var(--red);color:white;}

/* STATUS */
.status{
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
}

.hidden{display:none;}

/* 🔥 MOBILE RESPONSIVE */
@media(max-width:768px){
  body{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    display:flex;
    overflow-x:auto;
    white-space:nowrap;
  }

  .sidebar a{
    display:inline-block;
    margin-right:10px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>ADMIN</h2>
  <a onclick="show('dashboard')">📊 Dashboard</a>
  <a onclick="show('users')">👥 Users</a>
  <a onclick="show('pending')">⏳ Pending</a>
  <a onclick="show('approved')">✅ Approved</a>
  <a onclick="show('rejected')">❌ Rejected</a>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>System Overview</h2>

  <div class="grid">
    <div class="card">Total Users <h2 id="total">0</h2></div>
    <div class="card">Pending <h2 id="pendingCount">0</h2></div>
    <div class="card">Approved <h2 id="approvedCount">0</h2></div>
    <div class="card">Rejected <h2 id="rejectedCount">0</h2></div>
  </div>
</div>

<!-- USERS -->
<div id="users" class="hidden">
  <h2>All Users</h2>
  <div id="allUsers"></div>
</div>

<!-- PENDING -->
<div id="pending" class="hidden">
  <h2>Pending Approval</h2>
  <div id="pendingUsers"></div>
</div>

<!-- APPROVED -->
<div id="approved" class="hidden">
  <h2>Approved Users</h2>
  <div id="approvedUsers"></div>
</div>

<!-- REJECTED -->
<div id="rejected" class="hidden">
  <h2>Rejected Users</h2>
  <div id="rejectedUsers"></div>
</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];

/* NAV */
function show(id){
  ["dashboard","users","pending","approved","rejected"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

/* ACTIONS */
function approve(i){
  users[i].status="APPROVED";
  save();
}

function reject(i){
  users[i].status="REJECTED";
  save();
}

/* SAVE */
function save(){
  localStorage.setItem("users",JSON.stringify(users));
  render();
}

/* RENDER */
function render(){

let total=users.length;
let p=0,a=0,r=0;

allUsers.innerHTML="";
pendingUsers.innerHTML="";
approvedUsers.innerHTML="";
rejectedUsers.innerHTML="";

users.forEach((u,i)=>{

if(u.status==="PENDING") p++;
if(u.status==="APPROVED") a++;
if(u.status==="REJECTED") r++;

/* ALL */
allUsers.innerHTML+=`
<div class="user-card">
<b>${u.name}</b><br>
${u.email}<br>
Role: ${u.role}<br>
Status: ${u.status}
</div>`;

/* PENDING */
if(u.status==="PENDING"){
pendingUsers.innerHTML+=`
<div class="user-card">
<b>${u.name}</b><br>
${u.role}<br>
<button class="approve" onclick="approve(${i})">Approve</button>
<button class="reject" onclick="reject(${i})">Reject</button>
</div>`;
}

/* APPROVED */
if(u.status==="APPROVED"){
approvedUsers.innerHTML+=`
<div class="user-card">
<b>${u.name}</b><br>${u.role}
</div>`;
}

/* REJECTED */
if(u.status==="REJECTED"){
rejectedUsers.innerHTML+=`
<div class="user-card">
<b>${u.name}</b><br>${u.role}
</div>`;
}

});

total.innerText=total;
pendingCount.innerText=p;
approvedCount.innerText=a;
rejectedCount.innerText=r;

}

render();

</script>
<!-- LOGOUT BUTTON -->
<button onclick="logout()" style="
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  cursor:pointer;
  font-weight:600;
">
  🚪 Logout
</button>

<script>
function logout(){
  if(confirm("Are you sure you want to logout?")){
    localStorage.removeItem("role");
    window.location.href = "login.html";
  }
}
</script>
</body>
</html>
