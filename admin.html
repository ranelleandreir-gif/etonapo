<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kasipag Admin Panel</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  display:flex;
  background:#0f172a;
  color:white;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#020617;
  padding:20px;
  border-right:1px solid rgba(255,255,255,0.1);
}

.sidebar h2{
  margin-bottom:30px;
  color:#06b6d4;
}

.sidebar a{
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  cursor:pointer;
}

.sidebar a:hover{
  background:#06b6d4;
}

/* MAIN */
.main{
  flex:1;
  padding:30px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:30px;
}

.badge{
  background:#06b6d4;
  padding:8px 15px;
  border-radius:20px;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
}

.card p{
  font-size:26px;
  font-weight:bold;
}

/* FORM */
.form{
  margin:20px 0;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.form input,
.form select{
  padding:10px;
  border-radius:8px;
  border:none;
  background:#020617;
  color:white;
  border:1px solid rgba(255,255,255,0.1);
}

.form button{
  padding:10px 20px;
  background:#06b6d4;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:#020617;
}

th, td{
  padding:12px;
}

th{
  background:#1e293b;
}

.status{
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
}

.pending{
  background:#f59e0b;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Kasipag</h2>
  <a onclick="show('dash')">📊 Dashboard</a>
  <a onclick="show('loan')">💰 Loan System</a>
</div>

<div class="main">

  <!-- DASHBOARD -->
  <div id="dash">
    <div class="topbar">
      <h1>Admin Dashboard</h1>
      <div class="badge">Online</div>
    </div>

    <div class="grid">
      <div class="card"><h3>Total Loans</h3><p id="total">0</p></div>
      <div class="card"><h3>Borrowers</h3><p id="borrowers">0</p></div>
      <div class="card"><h3>Groups</h3><p id="groups">0</p></div>
      <div class="card"><h3>Pending</h3><p id="pending">0</p></div>
    </div>
  </div>

  <!-- LOANS -->
  <div id="loan" class="hidden">

    <div class="topbar">
      <h1>Loan Management</h1>
    </div>

    <div class="form">
      <input id="leader" placeholder="Name / Leader">
      <input id="members" placeholder="Members (comma separated)">
      <input id="amount" type="number" placeholder="Amount">

      <select id="type" onchange="toggleForm()">
        <option value="Solo">Solo</option>
        <option value="Group">Group</option>
      </select>

      <button onclick="addLoan()">Add Loan</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Borrower</th>
          <th>Amount</th>
          <th>Type</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="table"></tbody>
    </table>

  </div>

</div>

<script>
function show(id){
  document.getElementById("dash").classList.add("hidden");
  document.getElementById("loan").classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");
}

/* 🔥 TOGGLE MEMBERS FIELD */
function toggleForm(){
  let type = document.getElementById("type").value;
  let members = document.getElementById("members");

  if(type === "Solo"){
    members.style.display = "none";
  } else {
    members.style.display = "block";
  }
}

/* 🔥 ADD LOAN */
function addLoan(){
  let leader = document.getElementById("leader").value;
  let members = document.getElementById("members").value;
  let amount = document.getElementById("amount").value;
  let type = document.getElementById("type").value;

  if(!leader || !amount){
    alert("Please fill required fields");
    return;
  }

  let row = "";

  if(type === "Solo"){
    row = `
      <tr>
        <td>${leader}</td>
        <td>₱${amount}</td>
        <td>Solo</td>
        <td><span class="status pending">Pending</span></td>
      </tr>
    `;
  } else {
    if(!members){
      alert("Enter group members");
      return;
    }

    row = `
      <tr>
        <td>${leader}<br><small>${members}</small></td>
        <td>₱${amount}</td>
        <td>Group</td>
        <td><span class="status pending">Pending</span></td>
      </tr>
    `;
  }

  document.getElementById("table").innerHTML += row;

  // CLEAR FORM
  document.getElementById("leader").value = "";
  document.getElementById("members").value = "";
  document.getElementById("amount").value = "";
}

/* INIT */
toggleForm();
</script>

</body>
</html>
