<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Admin Panel</title>

<style>
:root{
  --bg:#0f172a;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --blue:#06b6d4;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  display:flex;
  background:var(--bg);
  color:white;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:rgba(2,6,23,0.9);
  padding:20px;
  border-right:1px solid var(--border);
}

.sidebar h2{
  color:var(--blue);
  margin-bottom:20px;
}

.sidebar a{
  display:block;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}

.sidebar a:hover{
  background:var(--blue);
  transform:translateX(5px);
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
}

/* DASHBOARD */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:15px;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  border:1px solid var(--border);
  transition:.3s;
}

.card:hover{
  transform:scale(1.03);
}

/* USER CARD */
.user-card{
  background:rgba(255,255,255,0.04);
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  border:1px solid var(--border);
}

/* BUTTONS */
button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:6px;
}

.approve{background:var(--green);color:white;}
.reject{background:var(--red);color:white;}

/* STATUS */
.hidden{display:none;}

/* LOGOUT */
.logout{
  margin-top:20px;
  background:var(--red);
  color:white;
  width:100%;
}

/* MOBILE */
@media(max-width:768px){
  body{flex-direction:column;}
  .sidebar{
    width:100%;
    display:flex;
    overflow-x:auto;
  }
  .sidebar a{
    display:inline-block;
    margin-right:10px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>ADMIN</h2>
  <a onclick="show('dashboard')">📊 Dashboard</a>
  <a onclick="show('users')">👥 Users</a>
  <a onclick="show('pending')">⏳ Pending</a>
  <a onclick="show('approved')">✅ Approved</a>
  <a onclick="show('rejected')">❌ Rejected</a>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>Overview</h2>

  <div class="grid">
    <div class="card">Total <h2 id="total">0</h2></div>
    <div class="card">Pending <h2 id="pendingCount">0</h2></div>
    <div class="card">Approved <h2 id="approvedCount">0</h2></div>
    <div class="card">Rejected <h2 id="rejectedCount">0</h2></div>
  </div>
</div>

<!-- USERS -->
<div id="users" class="hidden">
  <h2>All Users</h2>
  <div id="allUsers"></div>
</div>

<!-- PENDING -->
<div id="pending" class="hidden">
  <h2>Pending</h2>
  <div id="pendingUsers"></div>
</div>

<!-- APPROVED -->
<div id="approved" class="hidden">
  <h2>Approved</h2>
  <div id="approvedUsers"></div>
</div>

<!-- REJECTED -->
<div id="rejected" class="hidden">
  <h2>Rejected</h2>
  <div id="rejectedUsers"></div>
</div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];

/* NAV */
function show(id){
  ["dashboard","users","pending","approved","rejected"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

/* ACTION */
function approve(i){
  users[i].status="APPROVED";
  save();
}

function reject(i){
  users[i].status="REJECTED";
  save();
}

/* SAVE */
function save(){
  localStorage.setItem("users",JSON.stringify(users));
  render();
}

/* RENDER */
function render(){

let t=users.length, p=0, a=0, r=0;

allUsers.innerHTML="";
pendingUsers.innerHTML="";
approvedUsers.innerHTML="";
rejectedUsers.innerHTML="";

users.forEach((u,i)=>{

if(u.status==="PENDING") p++;
if(u.status==="APPROVED") a++;
if(u.status==="REJECTED") r++;

/* ALL */
allUsers.innerHTML+=`
<div class="user-card">
<b>${u.name}</b><br>
${u.email}<br>
${u.role}<br>
${u.status}
</div>`;

/* PENDING */
if(u.status==="PENDING"){
pendingUsers.innerHTML+=`
<div class="user-card">
<b>${u.name}</b><br>
${u.role}<br>
<button class="approve" onclick="approve(${i})">Approve</button>
<button class="reject" onclick="reject(${i})">Reject</button>
</div>`;
}

/* APPROVED */
if(u.status==="APPROVED"){
approvedUsers.innerHTML+=`
<div class="user-card"><b>${u.name}</b><br>${u.role}</div>`;
}

/* REJECTED */
if(u.status==="REJECTED"){
rejectedUsers.innerHTML+=`
<div class="user-card"><b>${u.name}</b><br>${u.role}</div>`;
}

});

total.innerText=t;
pendingCount.innerText=p;
approvedCount.innerText=a;
rejectedCount.innerText=r;

}

render();

/* LOGOUT */
function logout(){
  if(confirm("Logout?")){
    localStorage.removeItem("role");
    window.location.href="login.html";
  }
}

</script>

</body>
</html>
