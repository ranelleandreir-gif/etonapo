<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kasipag Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h2>Kasipag</h2>
  <a onclick="show('dash')">📊 Dashboard</a>
  <a onclick="show('loan')">💰 Loans</a>
</div>

<div class="main">

  <!-- DASHBOARD -->
  <div id="dash">
    <h1>Dashboard</h1>

    <div class="grid">
      <div class="card"><h3>Total Loans</h3><p id="total">0</p></div>
      <div class="card"><h3>Borrowers</h3><p id="borrowers">0</p></div>
      <div class="card"><h3>Groups</h3><p id="groups">0</p></div>
      <div class="card"><h3>Pending</h3><p id="pending">0</p></div>
    </div>
  </div>

  <!-- LOANS -->
  <div id="loan" class="hidden">

    <h1>Loan System</h1>

    <div class="form">
      <input id="leader" placeholder="Team Leader">
      <input id="members" placeholder="Members (comma separated)">
      <input id="amount" type="number" placeholder="Amount">

      <select id="type" onchange="toggle()">
        <option value="Solo">Solo</option>
        <option value="Group">Group</option>
      </select>

      <button onclick="addLoan()">Add Loan</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Borrower</th>
          <th>Amount</th>
          <th>Type</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="table"></tbody>
    </table>

  </div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
