<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kasipag Pro Admin</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --primary:#06b6d4;
  --text:#e5e7eb;
  --muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  background:linear-gradient(135deg,#020617,#0f172a);
  color:var(--text);
}

/* HEADER */
header{
  padding:14px;
  background:rgba(2,6,23,.9);
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  position:sticky;
  top:0;
}

button.logout{
  background:#ef4444;
  color:white;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

/* INPUT */
input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  cursor:pointer;
  font-weight:600;
  margin-top:5px;
}

/* STATUS */
.status{
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}

.Pending{background:rgba(245,158,11,.2);color:#fbbf24}
.Collected{background:rgba(59,130,246,.2);color:#60a5fa}
.Verified{background:rgba(34,197,94,.2);color:#4ade80}

/* GROUP BOX */
.groupBox{
  padding:10px;
  border:1px dashed #334155;
  border-radius:10px;
  margin-top:10px;
}

.small{
  font-size:12px;
  color:var(--muted);
}

</style>
</head>

<body>

<header>
  <div>🔥 KASIPAG PRO ADMIN</div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

<!-- ADD LOAN -->
<div class="card">
  <h3>Create Loan</h3>

  <select id="type" onchange="toggleGroup()">
    <option value="solo">Solo Loan</option>
    <option value="group">Group Loan</option>
  </select>

  <input id="name" placeholder="Name (Solo / Leader)">

  <input id="amount" placeholder="Amount">

  <!-- GROUP SECTION -->
  <div id="groupBox" class="groupBox" style="display:none;">
    <h4>Group Members</h4>
    <input id="memberName" placeholder="Member Name">
    <button onclick="addMember()">Add Member</button>
    <div id="members"></div>
  </div>

  <select id="rider">
    <option value="rider1">Rider 1</option>
    <option value="rider2">Rider 2</option>
    <option value="rider3">Rider 3</option>
  </select>

  <button onclick="addLoan()">Save Loan</button>
</div>

<!-- LIST -->
<div id="list"></div>

</div>

<script>

let loans = JSON.parse(localStorage.getItem("loans")) || [];
let members = [];

/* TOGGLE GROUP */
function toggleGroup(){
  let type = document.getElementById("type").value;
  document.getElementById("groupBox").style.display = type==="group" ? "block":"none";
}

/* ADD MEMBER */
function addMember(){
  let name = document.getElementById("memberName").value;
  if(!name) return;

  members.push(name);
  renderMembers();
  document.getElementById("memberName").value="";
}

/* SHOW MEMBERS */
function renderMembers(){
  let box = document.getElementById("members");
  box.innerHTML = "";

  members.forEach((m,i)=>{
    box.innerHTML += `<div>• ${m}</div>`;
  });
}

/* ADD LOAN */
function addLoan(){
  let type = document.getElementById("type").value;
  let name = document.getElementById("name").value;
  let amount = document.getElementById("amount").value;
  let rider = document.getElementById("rider").value;

  if(!name || !amount) return alert("Fill required fields");

  let loan = {
    id: Date.now(),
    type: type,
    leader: name,
    amount: Number(amount),
    rider: rider,
    status: "Pending",
    members: type==="group" ? members : []
  };

  loans.push(loan);

  localStorage.setItem("loans", JSON.stringify(loans));

  members = [];
  renderMembers();
  render();
}

/* STATUS FLOW */
function nextStatus(i){
  let status = loans[i].status;

  if(status==="Pending") loans[i].status="Collected";
  else if(status==="Collected") loans[i].status="Verified";
  else loans[i].status="Verified";

  localStorage.setItem("loans", JSON.stringify(loans));
  render();
}

/* DELETE */
function deleteLoan(i){
  if(confirm("Delete?")){
    loans.splice(i,1);
    localStorage.setItem("loans", JSON.stringify(loans));
    render();
  }
}

/* RENDER */
function render(){
  let list = document.getElementById("list");
  list.innerHTML="";

  loans.forEach((l,i)=>{

    list.innerHTML += `
    <div class="card">
      <b>${l.type.toUpperCase()} LOAN</b><br><br>

      👤 ${l.leader}<br>

      ${l.type==="group"
        ? `<div class="small">Group Members:<br>${l.members.map(m=>"• "+m).join("<br>")}</div>`
        : ""}

      <br>💰 ₱${l.amount}<br>

      <span class="status ${l.status}">${l.status}</span><br>

      🚴 Assigned: ${l.rider}<br><br>

      <button onclick="nextStatus(${i})">Next Status</button>
      <button onclick="deleteLoan(${i})" style="background:#ef4444;color:white;">Delete</button>
    </div>
    `;
  });

  localStorage.setItem("loans", JSON.stringify(loans));
}

/* REALTIME */
window.addEventListener("storage", render);

/* LOGOUT */
function logout(){
  localStorage.removeItem("role");
  window.location.href="index.html";
}

/* INIT */
render();

</script>

</body>
</html>
