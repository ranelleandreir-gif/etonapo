<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Loan Admin</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --blue:#06b6d4;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:var(--bg);
  color:white;
  min-height:100vh;
}

/* HEADER */
.header{
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(2,6,23,0.9);
  backdrop-filter:blur(10px);
}

.header h2{
  color:var(--blue);
}

/* CONTAINER */
.container{
  padding:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:15px;
  border-radius:14px;
}

/* FORM */
.form{
  background:var(--card);
  padding:15px;
  border-radius:14px;
  border:1px solid var(--border);
  margin-bottom:15px;
}

input,select{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  background:#020617;
  color:white;
}

button{
  padding:10px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:var(--blue);
  color:white;
}

/* TABLE */
table{
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
}

th{
  background:#020617;
  color:gray;
  font-size:12px;
}

/* STATUS */
.status{
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
}

.pending{background:var(--yellow);}
.collected{background:var(--blue);}
.verified{background:var(--green);}

/* GROUP TABLE */
.group-table input{
  width:100%;
  margin:2px 0;
}

/* MOBILE */
@media(max-width:768px){
  table{font-size:12px;}
}
</style>
</head>

<body>

<div class="header">
  <h2>Kasipag Loan Admin</h2>
  <button onclick="logout()" style="background:var(--red)">Logout</button>
</div>

<div class="container">

<!-- STATS -->
<div class="grid">
  <div class="card">Total Loans <h2 id="total">0</h2></div>
  <div class="card">Pending <h2 id="pending">0</h2></div>
  <div class="card">Collected <h2 id="collected">0</h2></div>
  <div class="card">Verified <h2 id="verified">0</h2></div>
</div>

<!-- LOAN FORM -->
<div class="form">

<select id="type" onchange="toggleForm()">
  <option value="solo">Solo Loan</option>
  <option value="group">Group Loan</option>
</select>

<!-- SOLO -->
<div id="soloForm">
  <input id="name" placeholder="Borrower Name">
  <input id="amount" type="number" placeholder="Amount">
</div>

<!-- GROUP -->
<div id="groupForm" style="display:none">
  <table class="group-table">
    <tr><th>Name</th><th>Amount</th></tr>
    <tbody id="groupBody"></tbody>
  </table>
  <button onclick="addRow()">Add Member</button>
</div>

<button onclick="addLoan()">Submit Loan</button>

</div>

<!-- TABLE -->
<table>
<thead>
<tr>
  <th>Name</th>
  <th>Amount</th>
  <th>Type</th>
  <th>Status</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

<script>

let loans = JSON.parse(localStorage.getItem("loans")) || [];

/* TOGGLE FORM */
function toggleForm(){
  let type = document.getElementById("type").value;
  document.getElementById("soloForm").style.display = type==="solo"?"block":"none";
  document.getElementById("groupForm").style.display = type==="group"?"block":"none";
}

/* ADD GROUP ROW */
function addRow(){
  let row = document.createElement("tr");
  row.innerHTML = `
    <td><input placeholder="Name"></td>
    <td><input type="number" placeholder="Amount"></td>
  `;
  document.getElementById("groupBody").appendChild(row);
}

/* ADD LOAN */
function addLoan(){

  let type = document.getElementById("type").value;

  if(type==="solo"){
    loans.push({
      name:name.value,
      amount:amount.value,
      type:"Solo",
      status:"Pending"
    });
  }

  else{
    let rows = document.querySelectorAll("#groupBody tr");
    rows.forEach(r=>{
      let n = r.children[0].children[0].value;
      let a = r.children[1].children[0].value;

      if(n && a){
        loans.push({
          name:n,
          amount:a,
          type:"Group",
          status:"Pending"
        });
      }
    });
  }

  localStorage.setItem("loans",JSON.stringify(loans));
  render();
}

/* VERIFY FLOW */
function collect(i){
  loans[i].status="Collected";
  save();
}

function verify(i){
  loans[i].status="Verified";
  save();
}

/* SAVE */
function save(){
  localStorage.setItem("loans",JSON.stringify(loans));
  render();
}

/* RENDER */
function render(){

let t=0,p=0,c=0,v=0;

table.innerHTML="";

loans.forEach((l,i)=>{

t++;
if(l.status==="Pending") p++;
if(l.status==="Collected") c++;
if(l.status==="Verified") v++;

table.innerHTML+=`
<tr>
<td>${l.name}</td>
<td>₱${l.amount}</td>
<td>${l.type}</td>
<td><span class="status ${l.status.toLowerCase()}">${l.status}</span></td>
<td>
${l.status==="Pending"
? `<button onclick="collect(${i})">Collect</button>`
: l.status==="Collected"
? `<button onclick="verify(${i})">Verify</button>`
: "✔"}
</td>
</tr>
`;

});

total.innerText=t;
pending.innerText=p;
collected.innerText=c;
verified.innerText=v;

}

function logout(){
  localStorage.removeItem("role");
  window.location.href="login.html";
}

render();

</script>

</body>
</html>
