<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Loans System</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --blue:#06b6d4;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:var(--bg);
  color:white;
}

/* HEADER */
.header{
  padding:15px;
  background:rgba(2,6,23,0.9);
  display:flex;
  justify-content:space-between;
}

/* SECTION */
.container{
  padding:15px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

/* FORM */
input,select{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  background:#020617;
  color:white;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:var(--blue);
  color:white;
}

/* GROUP TABLE */
table{
  width:100%;
  margin-top:10px;
}

th,td{
  padding:8px;
  border-bottom:1px solid var(--border);
}

.hidden{display:none;}

.status{
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
}

.pending{background:var(--yellow);}
</style>
</head>

<body>

<div class="header">
  <h3>Kasipag Loans</h3>
</div>

<div class="container">

<!-- LOAN TYPE -->
<div class="card">
  <select id="type" onchange="toggleType()">
    <option value="solo">Solo Loan</option>
    <option value="group">Group Loan</option>
  </select>
</div>

<!-- SOLO FORM -->
<div class="card" id="solo">
  <h3>Solo Loan</h3>
  <input id="soloName" placeholder="Borrower Name">
  <input id="soloAmount" type="number" placeholder="Amount">
  <button onclick="addSolo()">Add Solo Loan</button>
</div>

<!-- GROUP FORM -->
<div class="card hidden" id="group">
  <h3>Group Loan</h3>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody id="groupBody"></tbody>
  </table>

  <button onclick="addRow()">+ Add Member</button>
  <button onclick="addGroup()">Submit Group Loan</button>
</div>

<!-- LIST -->
<div class="card">
  <h3>Loans List</h3>
  <div id="list"></div>
</div>

</div>

<script>

let loans = JSON.parse(localStorage.getItem("loans")) || [];

/* SWITCH TYPE */
function toggleType(){
  let t = document.getElementById("type").value;
  document.getElementById("solo").classList.toggle("hidden", t!=="solo");
  document.getElementById("group").classList.toggle("hidden", t!=="group");
}

/* ADD ROW GROUP */
function addRow(){
  let row = document.createElement("tr");
  row.innerHTML = `
    <td><input placeholder="Name"></td>
    <td><input type="number" placeholder="Amount"></td>
  `;
  document.getElementById("groupBody").appendChild(row);
}

/* SOLO LOAN */
function addSolo(){

  loans.push({
    type:"Solo",
    name:soloName.value,
    amount:soloAmount.value,
    status:"Pending"
  });

  save();
}

/* GROUP LOAN */
function addGroup(){

  let rows = document.querySelectorAll("#groupBody tr");

  rows.forEach(r=>{
    let name = r.children[0].children[0].value;
    let amount = r.children[1].children[0].value;

    if(name && amount){
      loans.push({
        type:"Group",
        name:name,
        amount:amount,
        status:"Pending"
      });
    }
  });

  save();
}

/* SAVE */
function save(){
  localStorage.setItem("loans",JSON.stringify(loans));
  render();
}

/* RENDER */
function render(){

list.innerHTML="";

loans.forEach(l=>{
  list.innerHTML+=`
  <div class="card">
    <b>${l.name}</b><br>
    ₱${l.amount}<br>
    ${l.type}<br>
    <span class="status pending">${l.status}</span>
  </div>
  `;
});

}

render();

</script>

</body>
</html>
