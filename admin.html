<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kasipag Admin Panel</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.08);
  --primary:#06b6d4;
  --text:#e5e7eb;
  --muted:#94a3b8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  background:linear-gradient(135deg,#020617,#0f172a);
  color:var(--text);
}

/* HEADER */
header{
  padding:14px;
  background:rgba(2,6,23,.85);
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  position:sticky;
  top:0;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

/* INPUT */
input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
}

/* BUTTON */
button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  cursor:pointer;
  font-weight:600;
}

.small{
  padding:6px 10px;
  font-size:12px;
  margin-top:5px;
}

/* STATUS */
.status{
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}

.Pending{background:rgba(245,158,11,.2);color:#fbbf24}
.Collected{background:rgba(59,130,246,.2);color:#60a5fa}
.Verified{background:rgba(34,197,94,.2);color:#4ade80}

</style>
</head>

<body>

<header>
  <div>🔥 KASIPAG ADMIN PANEL</div>
</header>

<div class="container">

<!-- ADD LOAN -->
<div class="card">
  <h3>Add Loan</h3>

  <input id="name" placeholder="Borrower Name">
  <input id="amount" placeholder="Amount">

  <select id="rider">
    <option value="rider1">Rider 1</option>
    <option value="rider2">Rider 2</option>
    <option value="rider3">Rider 3</option>
  </select>

  <button onclick="addLoan()">Add Loan</button>
</div>

<!-- LIST -->
<div id="list"></div>

</div>

<script>

let loans = JSON.parse(localStorage.getItem("loans")) || [];

/* ADD LOAN */
function addLoan(){
  let name = document.getElementById("name").value;
  let amount = document.getElementById("amount").value;
  let rider = document.getElementById("rider").value;

  if(!name || !amount){
    return alert("Fill all fields");
  }

  loans.push({
    leader: name,
    amount: Number(amount),
    rider: rider.toLowerCase(),
    status: "Pending"
  });

  localStorage.setItem("loans", JSON.stringify(loans));
  render();
}

/* CHANGE RIDER */
function changeRider(i){
  let r = prompt("Enter rider1 / rider2 / rider3");

  if(r){
    r = r.toLowerCase().trim();

    if(!["rider1","rider2","rider3"].includes(r)){
      return alert("Invalid rider!");
    }

    loans[i].rider = r;
    localStorage.setItem("loans", JSON.stringify(loans));
    render();
  }
}

/* CHANGE STATUS */
function changeStatus(i){
  let s = prompt("Pending / Collected / Verified");

  if(s){
    s = s.trim();

    if(!["Pending","Collected","Verified"].includes(s)){
      return alert("Invalid status!");
    }

    loans[i].status = s;
    localStorage.setItem("loans", JSON.stringify(loans));
    render();
  }
}

/* DELETE (OPTIONAL EXTRA FOR DEFENSE) */
function deleteLoan(i){
  if(confirm("Delete this loan?")){
    loans.splice(i,1);
    localStorage.setItem("loans", JSON.stringify(loans));
    render();
  }
}

/* RENDER */
function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  loans.forEach((l,i)=>{

    list.innerHTML += `
    <div class="card">
      <b>${l.leader}</b><br>
      ₱${l.amount}<br>

      <span class="status ${l.status}">${l.status}</span><br>

      <small>Assigned: ${l.rider}</small><br><br>

      <button class="small" onclick="changeRider(${i})">Change Rider</button>
      <button class="small" onclick="changeStatus(${i})">Change Status</button>
      <button class="small" onclick="deleteLoan(${i})" style="background:#ef4444;color:white;">Delete</button>
    </div>
    `;
  });

  localStorage.setItem("loans", JSON.stringify(loans));
}

/* REALTIME SYNC */
window.addEventListener("storage", render);

/* INIT */
render();

</script>

</body>
</html>
