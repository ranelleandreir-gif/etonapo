<!DOCTYPE html>
<html>
<head>
<title>Kasipag Admin Panel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  display:flex;
  background:#0f172a;
  color:white;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  background:#020617;
  padding:20px;
}

.sidebar h2{
  color:#06b6d4;
  margin-bottom:30px;
}

.sidebar a{
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  cursor:pointer;
}

.sidebar a:hover{
  background:#06b6d4;
}

/* MAIN */
.main{
  flex:1;
  padding:30px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
}

.card p{
  font-size:24px;
  font-weight:bold;
}

/* FORM */
.form{
  margin:20px 0;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.form input, .form select{
  padding:10px;
  border-radius:8px;
  border:none;
  background:#020617;
  color:white;
}

/* BUTTON */
button{
  padding:10px 20px;
  background:#06b6d4;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* TABLE */
table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
  background:#020617;
}

th, td{
  padding:12px;
}

th{
  background:#1e293b;
}

/* STATUS */
.status{
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
}

.pending{background:#f59e0b;}
.paid{background:#22c55e;}
.assigned{background:#3b82f6;}

.hidden{display:none;}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Kasipag</h2>
  <a onclick="show('dash')">📊 Dashboard</a>
  <a onclick="show('loan')">💰 Loan</a>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dash">
  <div class="topbar">
    <h1>Admin Dashboard</h1>
  </div>

  <div class="grid">
    <div class="card"><h3>Total Loans</h3><p id="total">0</p></div>
    <div class="card"><h3>Borrowers</h3><p id="borrowers">0</p></div>
    <div class="card"><h3>Pending</h3><p id="pending">0</p></div>
  </div>

  <h2 style="margin-top:20px;">Rider Status</h2>
  <div class="grid">
    <div class="card">Rider 1: <span id="r1">0</span> loans</div>
    <div class="card">Rider 2: <span id="r2">0</span> loans</div>
    <div class="card">Rider 3: <span id="r3">0</span> loans</div>
  </div>
</div>

<!-- LOANS -->
<div id="loan" class="hidden">

  <h1>Loan Management</h1>

  <div class="form">
    <input id="leader" placeholder="Borrower Name">
    <input id="members" placeholder="Members (optional)">
    <input id="amount" type="number" placeholder="Amount">

    <select id="type">
      <option>Solo</option>
      <option>Group</option>
    </select>

    <select id="rider">
      <option>Rider 1</option>
      <option>Rider 2</option>
      <option>Rider 3</option>
    </select>

    <button onclick="addLoan()">Add Loan</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Type</th>
        <th>Rider</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="table"></tbody>
  </table>

</div>

</div>

<script>

/* SWITCH PAGE */
function show(id){
  document.getElementById("dash").classList.add("hidden");
  document.getElementById("loan").classList.add("hidden");
  document.getElementById(id).classList.remove("hidden");
}

/* STORAGE */
let loans = JSON.parse(localStorage.getItem("loans")) || [];

/* ADD LOAN */
function addLoan(){
  let leader = leaderInput.value;
  let members = membersInput.value;
  let amount = amountInput.value;
  let type = typeInput.value;
  let rider = riderInput.value;

  if(!leader || !amount){
    alert("Fill required");
    return;
  }

  loans.push({
    leader, members, amount, type, rider, status:"Pending"
  });

  localStorage.setItem("loans", JSON.stringify(loans));

  render();
}

/* RENDER TABLE + DASHBOARD */
function render(){
  let table = document.getElementById("table");
  table.innerHTML = "";

  let total = loans.length;
  let borrowers = new Set();
  let pending = 0;

  let r1=0,r2=0,r3=0;

  loans.forEach(l => {
    borrowers.add(l.leader);
    if(l.status==="Pending") pending++;

    if(l.rider==="Rider 1") r1++;
    if(l.rider==="Rider 2") r2++;
    if(l.rider==="Rider 3") r3++;

    table.innerHTML += `
      <tr>
        <td>${l.leader}</td>
        <td>₱${l.amount}</td>
        <td>${l.type}</td>
        <td>${l.rider}</td>
        <td><span class="status pending">${l.status}</span></td>
      </tr>
    `;
  });

  document.getElementById("total").innerText = total;
  document.getElementById("borrowers").innerText = borrowers.size;
  document.getElementById("pending").innerText = pending;

  document.getElementById("r1").innerText = r1;
  document.getElementById("r2").innerText = r2;
  document.getElementById("r3").innerText = r3;
}

/* INPUT SHORTCUTS */
const leaderInput = document.getElementById("leader");
const membersInput = document.getElementById("members");
const amountInput = document.getElementById("amount");
const typeInput = document.getElementById("type");
const riderInput = document.getElementById("rider");

/* INIT */
render();

</script>

</body>
</html>
