<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Access</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-box">
    <img src="kasipag.png" class="logo">
    <h2>Admin Access Key</h2>

    <input type="password" id="accessKey" placeholder="Enter Access Key">

    <button onclick="checkAccess()">Enter</button>

    <p id="msg"></p>
  </div>

  <script src="script.js"></script>

  <script>
function checkAccess(){
  let key = document.getElementById("accessKey").value;

  if(key === "kasipag123"){
    window.location.href = "admin-login.html"; // ito ang pupuntahan
  } else {
    document.getElementById("msg").innerText = "Wrong Access Key!";
  }
}
</script>

<script>
document.getElementById("accessKey").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    checkAccess();
  }
});
</script>
</body>
</html>
