<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kasipag System</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:white;
}

.container{
  text-align:center;
}

h1{
  margin-bottom:20px;
  font-size:28px;
  color:#06b6d4;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2, 150px);
  gap:15px;
}

button{
  padding:15px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  color:white;
  cursor:pointer;
  transition:.3s;
  border:1px solid rgba(255,255,255,0.1);
}

button:hover{
  background:#06b6d4;
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">
  <h1>Kasipag System</h1>

  <div class="grid">
    <button onclick="setRole('admin')">Admin</button>
    <button onclick="setRole('cashier')">Cashier</button>
    <button onclick="setRole('rider 1')">Rider 1</button>
    <button onclick="setRole('rider 2')">Rider 2</button>
    <button onclick="setRole('rider 3')">Rider 3</button>
  </div>
</div>

<script>
function setRole(role){
  localStorage.setItem("role", role);
  window.location.href = "login.html";
}
</script>

</body>
</html>
