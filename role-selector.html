<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kasipag Role Select</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  overflow:hidden;
}

/* 🌈 ANIMATED BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background: radial-gradient(circle at 20% 20%, #06b6d4, transparent 40%),
              radial-gradient(circle at 80% 80%, #3b82f6, transparent 40%),
              linear-gradient(135deg,#0f172a,#0b1220);
  animation: bgMove 10s ease-in-out infinite alternate;
  z-index:-2;
}

@keyframes bgMove{
  from{filter:brightness(1);}
  to{filter:brightness(1.2);}
}

/* 🌟 FLOATING GLOW */
.glow{
  position:fixed;
  width:400px;
  height:400px;
  background:#06b6d4;
  filter:blur(120px);
  opacity:0.3;
  top:10%;
  left:10%;
  z-index:-1;
}

/* 💎 MAIN CARD */
.selector-box{
  width:350px;
  padding:40px;
  border-radius:25px;
  background:rgba(255,255,255,0.06);
  backdrop-filter: blur(25px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 25px 60px rgba(0,0,0,0.4);
  text-align:center;
}

/* LOGO */
.logo{
  width:70px;
  margin-bottom:15px;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
}

/* TITLE */
h2{
  font-size:22px;
  margin-bottom:25px;
}

/* SELECT BOX */
select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  margin-bottom:20px;
  background:rgba(255,255,255,0.1);
  color:white;
  font-size:14px;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,#06b6d4,#3b82f6);
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 10px 30px rgba(6,182,212,0.3);
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 15px 40px rgba(6,182,212,0.5);
}

/* SMALL TEXT EFFECT */
.selector-box::after{
  content:"Secure Access System";
  display:block;
  margin-top:15px;
  font-size:12px;
  opacity:0.5;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="selector-box">

  <img src="kasipag.png" class="logo">

  <h2>Select Your Role</h2>

  <select id="role">
    <option value="admin">Admin</option>
    <option value="cashier">Cashier</option>
    <option value="rider">Rider</option>
  </select>

  <button onclick="goToLogin()">Proceed</button>

</div>

<script>
function goToLogin(){
  let role = document.getElementById("role").value;

  localStorage.setItem("role", role);

  if(role === "admin"){
    window.location.href = "admin-access.html";
  } else {
    window.location.href = "login.html";
  }
}
</script>

</body>
</html>
