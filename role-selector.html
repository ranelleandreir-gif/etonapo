<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kasipag Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="selector-box">

    <img src="kasipag.png" class="logo">

    <h2>Select Your Role</h2>

    <select id="role">
      <option value="admin">Admin</option>
      <option value="cashier">Cashier</option>
      <option value="rider">Rider</option>
    </select>

    <button onclick="goToLogin()">Proceed</button>

  </div>

 <script>
  function goToLogin(){
    let role = document.getElementById("role").value;

    // save role
    localStorage.setItem("role", role);

    if(role === "admin"){
      window.location.href = "admin-access.html"; // 👉 admin direct dito
    } else {
      window.location.href = "login.html"; // 👉 cashier & rider dito
    }
  }
</script>

</body>
</html>
