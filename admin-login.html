<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kasipag Elite Admin</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:white;
}

/* 🔥 LOGIN BOX */
.login-box{
  width:360px;
  padding:40px;
  border-radius:20px;
  background:rgba(15,23,42,0.95);
  border:1px solid rgba(6,182,212,0.2);
  box-shadow:0 0 60px rgba(6,182,212,0.2);
  text-align:center;
}

/* LOGO */
.logo{
  width:65px;
  margin-bottom:15px;
}

/* TITLE */
h2{
  margin-bottom:5px;
}

.secure{
  font-size:12px;
  color:#38bdf8;
  margin-bottom:20px;
  opacity:0.8;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  background:#020617;
  color:white;
  border:1px solid rgba(255,255,255,0.1);
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#06b6d4;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  box-shadow:0 0 20px #06b6d4;
}

/* MESSAGE */
#msg{
  margin-top:10px;
  font-size:13px;
}

/* SHAKE */
.shake{
  animation:shake 0.3s;
}

@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  50%{transform:translateX(6px);}
  75%{transform:translateX(-6px);}
  100%{transform:translateX(0);}
}

/* LOADING BAR */
.load{
  height:4px;
  background:#06b6d4;
  width:0%;
  margin-top:10px;
  transition:0.4s;
}
</style>
</head>

<body>

<div class="login-box" id="box">
  <img src="kasipag.png" class="logo">

  <h2>ELITE ADMIN</h2>
  <div class="secure">🔐 AUTHORIZED PERSONNEL ONLY</div>

  <input type="text" id="user" placeholder="Username">
  <input type="password" id="pass" placeholder="Password">

  <button onclick="adminLogin()">LOGIN</button>

  <div class="load" id="load"></div>
  <p id="msg"></p>
</div>

<script>
function adminLogin(){
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;
  const msg = document.getElementById("msg");
  const box = document.getElementById("box");
  const load = document.getElementById("load");

  load.style.width = "100%";
  msg.innerHTML = "Verifying credentials...";

  setTimeout(()=>{
    // 🔐 DEMO ACCOUNT
    if(u === "admin" && p === "kasipag123"){
      msg.style.color = "#22c55e";
      msg.innerHTML = "Access Granted ✔";
      window.location.href = "admin-dashboard.html";
    } else {
      msg.style.color = "#ef4444";
      msg.innerHTML = "Access Denied ✖";
      box.classList.add("shake");
      setTimeout(()=>box.classList.remove("shake"),300);
      load.style.width = "0%";
    }
  },1500);
}
</script>

</body>
</html>
