<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:white;
}

.card{
  width:350px;
  padding:35px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#06b6d4;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  background:#020617;
  color:white;
}

input:focus{
  outline:2px solid #06b6d4;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:10px;
  background:#06b6d4;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#0891b2;
}

#msg{
  text-align:center;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

  <h2 id="roleTitle"></h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="msg"></p>

</div>

<script>
let role = localStorage.getItem("role") || "guest";
document.getElementById("roleTitle").innerText = role.toUpperCase() + " LOGIN";

const accounts = {
  admin:{email:"admin@kasipag.com",password:"admin123"},
  cashier:{email:"cashier@kasipag.com",password:"cashier123"},
  "rider 1":{email:"rider1@kasipag.com",password:"rider123"},
  "rider 2":{email:"rider2@kasipag.com",password:"rider123"},
  "rider 3":{email:"rider3@kasipag.com",password:"rider123"}
};

function login(){
  let email=email.value;
  let password=password.value;
  let msg=document.getElementById("msg");

  let acc=accounts[role];

  if(acc && email===acc.email && password===acc.password){

    msg.style.color="#22c55e";
    msg.innerHTML="Login Successful";

    setTimeout(()=>{
      switch(role){
        case "admin": location="admin.html"; break;
        case "cashier": location="cashier.html"; break;
        case "rider 1": location="rider.html"; break;
        case "rider 2": location="rider2.html"; break;
        case "rider 3": location="rider3.html"; break;
      }
    },1000);

  } else {
    msg.style.color="#ef4444";
    msg.innerHTML="Invalid credentials";
  }
}
</script>

</body>
</html>
