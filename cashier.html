<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Cashier Ledger Pro</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --primary:#06b6d4;
  --green:#22c55e;
  --blue:#3b82f6;
  --yellow:#f59e0b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:var(--bg);
  color:white;
  overflow-x:hidden;
}

/* 🔥 FLOATING BACKGROUND WIDGETS */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

.circle{
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  filter:blur(90px);
  opacity:0.3;
  animation:float 8s infinite alternate;
}

.c1{background:#06b6d4;top:10%;left:10%;}
.c2{background:#3b82f6;bottom:10%;right:10%;}
.c3{background:#22c55e;top:50%;left:60%;}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(40px);}
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  background:rgba(2,6,23,0.7);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

/* KPI WIDGETS */
.kpi{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  padding:15px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:15px;
  border-radius:16px;
  backdrop-filter:blur(10px);
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card h4{
  font-size:12px;
  opacity:.7;
}

.card p{
  font-size:20px;
  font-weight:bold;
}

/* FILTER */
.filters{
  display:flex;
  gap:10px;
  padding:0 15px 15px;
  flex-wrap:wrap;
}

input,select{
  padding:10px;
  border-radius:10px;
  border:none;
  background:#020617;
  color:white;
}

/* TABLE */
.table{
  margin:15px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#020617;
  padding:10px;
  font-size:12px;
  color:gray;
}

td{
  padding:10px;
  border-bottom:1px solid var(--border);
}

/* STATUS */
.status{
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
}

.collected{background:var(--blue);}
.verified{background:var(--green);}

/* BUTTON */
button{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.05);
}

/* MOBILE */
.mobile{
  display:none;
  padding:15px;
}

.item{
  background:var(--card);
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  backdrop-filter:blur(10px);
}

/* RESPONSIVE */
@media(max-width:768px){
  table{display:none;}
  .mobile{display:block;}
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
</div>

<!-- HEADER -->
<div class="header">
  <h3>💼 Cashier Ledger</h3>
  <small>Kasipag Finance System</small>
</div>

<!-- KPI WIDGETS -->
<div class="kpi">
  <div class="card"><h4>Total</h4><p id="total">0</p></div>
  <div class="card"><h4>Collected</h4><p id="collected">0</p></div>
  <div class="card"><h4>Verified</h4><p id="verified">0</p></div>
  <div class="card"><h4>Revenue</h4><p id="amount">₱0</p></div>
</div>

<!-- FILTER -->
<div class="filters">
  <input id="search" placeholder="Search borrower">
  <select id="filter">
    <option value="all">All</option>
    <option value="Collected">Collected</option>
    <option value="Verified">Verified</option>
  </select>
</div>

<!-- TABLE -->
<div class="table">
<table>
<thead>
<tr>
<th>Ref</th>
<th>Name</th>
<th>Amount</th>
<th>Rider</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<!-- MOBILE -->
<div class="mobile" id="mobile"></div>

<script>

let loans = JSON.parse(localStorage.getItem("loans")) || [];

/* REF */
function ref(){
  return "KS-" + Math.floor(Math.random()*999999);
}

/* RENDER */
function render(){

let table=document.getElementById("table");
let mobile=document.getElementById("mobile");

table.innerHTML="";
mobile.innerHTML="";

let total=0,collected=0,verified=0,amount=0;

let search=document.getElementById("search").value.toLowerCase();
let filter=document.getElementById("filter").value;

loans.forEach((l,i)=>{

if(!l.ref) l.ref=ref();

if(search && !l.leader.toLowerCase().includes(search)) return;
if(filter!="all" && l.status!=filter) return;

total++;

if(l.status=="Collected") collected++;
if(l.status=="Verified"){
  verified++;
  amount+=Number(l.amount);
}

/* TABLE */
table.innerHTML+=`
<tr>
<td>${l.ref}</td>
<td>${l.leader}</td>
<td>₱${l.amount}</td>
<td>${l.rider}</td>
<td>${l.date||"-"}</td>
<td><span class="status ${l.status.toLowerCase()}">${l.status}</span></td>
<td>
${l.status=="Collected"
? `<button onclick="verify(${i})">Verify</button>`
: "✔"}
</td>
</tr>`;

/* MOBILE */
mobile.innerHTML+=`
<div class="item">
<b>${l.leader}</b><br>
₱${l.amount}<br>
${l.rider}<br>
<span class="status ${l.status.toLowerCase()}">${l.status}</span><br>
${l.status=="Collected"
? `<button onclick="verify(${i})">Verify</button>`
: ""}
</div>`;
});

document.getElementById("total").innerText=total;
document.getElementById("collected").innerText=collected;
document.getElementById("verified").innerText=verified;
document.getElementById("amount").innerText="₱"+amount;

localStorage.setItem("loans",JSON.stringify(loans));
}

/* VERIFY */
function verify(i){
  loans[i].status="Verified";
  loans[i].date=new Date().toLocaleDateString();
  localStorage.setItem("loans",JSON.stringify(loans));
  render();
}

/* EVENTS */
search.addEventListener("input",render);
filter.addEventListener("change",render);

/* INIT */
render();

</script>
<!-- LOGOUT BUTTON -->
<button onclick="logout()" style="
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  cursor:pointer;
  font-weight:600;
">
  🚪 Logout
</button>

<script>
function logout(){
  if(confirm("Are you sure you want to logout?")){
    localStorage.removeItem("role");
    window.location.href = "login.html";
  }
}
</script>
</body>
</html>
