<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasipag Microfinance</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  background:#0f172a;
  color:white;
  overflow-x:hidden;
}

/* BACKGROUND EFFECT */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

.circle{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:0.4;
  animation:float 8s infinite alternate;
}

.circle1{width:300px;height:300px;background:#06b6d4;top:10%;left:10%;}
.circle2{width:350px;height:350px;background:#3b82f6;bottom:10%;right:10%;}
.circle3{width:200px;height:200px;background:#22c55e;top:50%;left:60%;}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(40px);}
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
}

.logo{
  font-weight:bold;
  color:#06b6d4;
}

/* HERO */
.hero{
  min-height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.hero h1{
  font-size:45px;
}

.hero p{
  opacity:0.7;
  margin-top:10px;
}

/* BUTTON */
.btn{
  margin-top:20px;
  padding:12px 20px;
  border:none;
  border-radius:50px;
  background:#06b6d4;
  color:white;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.05);
}

/* FEATURES */
.features{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:50px;
}

.card{
  width:250px;
  padding:20px;
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  backdrop-filter:blur(10px);
  text-align:center;
}

/* CTA */
.cta{
  text-align:center;
  padding:60px;
  background:#06b6d4;
}

/* MODAL */
.modal{
  position:fixed;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.modal-box{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  width:320px;
}

input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  background:#020617;
  color:white;
}

.close{
  float:right;
  cursor:pointer;
  color:red;
}

#msg{
  font-size:13px;
  margin-top:8px;
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg">
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>
</div>

<header>
  <div class="logo">Kasipag</div>
  <button class="btn" onclick="openModal()">Create Account</button>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Fast & Smart Microfinance System</h1>
  <p>Loan tracking + rider + cashier system</p>

  <a href="role-selector.html">
    <button class="btn">Get Started</button>
  </a>
</section>

<!-- FEATURES -->
<section class="features">

  <div class="card">
    <h3>💰 Loans</h3>
    <p>Fast approval system</p>
  </div>

  <div class="card">
    <h3>📊 Tracking</h3>
    <p>Real-time monitoring</p>
  </div>

  <div class="card">
    <h3>🔒 Secure</h3>
    <p>Protected system</p>
  </div>

</section>

<!-- CTA -->
<section class="cta">
  <h2>Start Using Kasipag Now</h2>
  <button class="btn" onclick="openModal()">Sign Up</button>
</section>

<footer style="text-align:center;padding:20px;opacity:0.6;">
  © 2026 Kasipag System
</footer>

<!-- 🔥 SIGNUP MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">

    <span class="close" onclick="closeModal()">✖</span>

    <h3>Create Account</h3>

    <input id="name" placeholder="Full Name">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <select id="role">
      <option value="cashier">Cashier</option>
      <option value="rider 1">Rider 1</option>
      <option value="rider 2">Rider 2</option>
      <option value="rider 3">Rider 3</option>
    </select>

    <button class="btn" onclick="signup()">Sign Up</button>

    <p id="msg"></p>

  </div>

</div>

<script>

function openModal(){
  modal.style.display="flex";
}

function closeModal(){
  modal.style.display="none";
}

/* 🔥 SIGNUP WITH PENDING APPROVAL */
function signup(){

  let users = JSON.parse(localStorage.getItem("users")) || [];

  let newUser = {
    name:name.value,
    email:email.value,
    password:password.value,
    role:role.value,
    status:"pending"
  };

  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));

  msg.style.color="#f59e0b";
  msg.innerHTML="⏳ Waiting for admin confirmation...";

  setTimeout(()=>{
    alert("Account submitted ✔ Please wait for approval");
    closeModal();
  },1500);

}

</script>

</body>
</html>
